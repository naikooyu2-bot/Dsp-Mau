name: carrozzeria_dsp_player
description: A custom local audio player inspired by Pioneer Carrozzeria OEL displays and MAU DSP.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  just_audio: ^0.9.36
  audio_session: ^0.1.18
  path_provider: ^2.1.2
  permission_handler: ^11.3.1
  file_picker: ^8.0.0

flutter:
  uses-material-design: true
