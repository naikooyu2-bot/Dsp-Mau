name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          cache: true

      - name: Create Android Local Wrapper
        run: |
          flutter create . --org com.maudsp.player --project-name carrozzeria_dsp_player --platforms=android

      - name: Restore Custom Pubspec
        run: |
          cat << 'EOF' > pubspec.yaml
          name: carrozzeria_dsp_player
          description: A custom local audio player inspired by Pioneer Carrozzeria OEL displays and MAU DSP.
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            just_audio: ^0.9.36
            audio_session: ^0.1.18
            path_provider: ^2.1.2
            permission_handler: ^11.3.1
            file_picker: ^8.0.0

          flutter:
            uses-material-design: true
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
