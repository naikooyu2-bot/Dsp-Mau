name: Build Android APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          cache: true

      - name: Configure Android Permissions & MainActivity
        run: |
          flutter create . --org com.maudsp.player --project-name carrozzeria_dsp_player --platforms=android
          
          # Ensure AndroidManifest has storage/media read permissions
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>\n    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST_PATH"
          fi

          # Write MainActivity Kotlin bridge
          mkdir -p android/app/src/main/kotlin/com/maudsp/player
          cat << 'EOF' > android/app/src/main/kotlin/com/maudsp/player/MainActivity.kt
          package com.maudsp.player

          import android.content.Intent
          import android.media.audiofx.AudioEffect
          import androidx.annotation.NonNull
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity: FlutterActivity() {
              private val CHANNEL = "com.maudsp.player/audio_fx"

              override fun configureFlutterEngine(@NonNull flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)

                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      val sessionId = call.argument<Int>("sessionId") ?: 0

                      when (call.method) {
                          "initEffects" -> result.success(true)
                          "openAudioEffects" -> {
                              try {
                                  val intent = Intent(AudioEffect.ACTION_DISPLAY_AUDIO_EFFECT_CONTROL_PANEL).apply {
                                      putExtra(AudioEffect.EXTRA_AUDIO_SESSION, sessionId)
                                      putExtra(AudioEffect.EXTRA_PACKAGE_NAME, packageName)
                                      putExtra(AudioEffect.EXTRA_CONTENT_TYPE, AudioEffect.CONTENT_TYPE_MUSIC)
                                  }
                                  if (intent.resolveActivity(packageManager) != null) {
                                      startActivityForResult(intent, 0)
                                  }
                                  result.success(true)
                              } catch (e: Exception) {
                                  result.success(false)
                              }
                          }
                          else -> result.notImplemented()
                      }
                  }
              }
          }
          EOF

      - name: Restore Custom Pubspec with OnAudioQuery
        run: |
          cat << 'EOF' > pubspec.yaml
          name: carrozzeria_dsp_player
          description: A custom local audio player inspired by Pioneer Carrozzeria OEL displays.
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            just_audio: ^0.9.36
            audio_session: ^0.1.18
            permission_handler: ^11.3.1
            on_audio_query: ^2.9.0
            file_picker: ^8.0.0

          flutter:
            uses-material-design: true
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
